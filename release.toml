# cargo-release config. Not installed/verified on this machine as of writing —
# written by hand to match the shape of past manual "Release vX.Y.Z" commits
# (see `git log --oneline | grep Release`, e.g. 39e63cc which bumped exactly
# Cargo.toml, herdr-plugin.toml, .claude-plugin/plugin.json, package.json).
# `cargo release <level> --dry-run` should be run and its file list compared
# against that commit before trusting this config for a real release.
#
# This is not a crates.io crate: never publish, never push (the human pushes
# the tag deliberately to trigger .github/workflows/release.yml, which builds
# on `v*` tags and cross-checks the tag against Cargo.toml/herdr-plugin.toml).
publish = false
push = false

pre-release-commit-message = "Release v{{version}}"
tag-name = "v{{version}}"
tag-message = "v{{version}}"

# Cargo.toml's own [package].version is bumped by cargo-release itself and
# does not need a replacement entry here.
[[pre-release-replacements]]
file = "herdr-plugin.toml"
search = "^version = \".*\"$"
replace = "version = \"{{version}}\""
min = 1
max = 1

[[pre-release-replacements]]
file = ".claude-plugin/plugin.json"
search = "^  \"version\": \".*\",$"
replace = "  \"version\": \"{{version}}\","
min = 1
max = 1

[[pre-release-replacements]]
file = "package.json"
search = "^  \"version\": \".*\",$"
replace = "  \"version\": \"{{version}}\","
min = 1
max = 1
